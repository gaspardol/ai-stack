<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meeting notes — AI Stack</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="ui/style.css">
  <style>
    body { display: grid; grid-template-columns: 300px 1fr; height: 100vh; overflow: hidden; }
    aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
    aside .top { padding: 12px; display: flex; gap: 8px; }
    #search { flex: 1; }
    #list { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
    .group { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 14px 8px 4px; }
    .item { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    .item:hover { background: rgba(127,127,127,.12); }
    .item.selected { background: var(--accent); color: #fff; }
    .item.selected .muted { color: rgba(255,255,255,.8); }
    .item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    main { display: flex; flex-direction: column; min-height: 0; }
    #detail { flex: 1; overflow-y: auto; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 32px 40px; }
    #mtitle { font-size: 24px; font-weight: 700; border: 0; padding: 0; width: 100%; background: transparent; }
    #mtitle:focus { outline: none; }
    .tabs { display: flex; gap: 4px; margin: 16px 0; border-bottom: 1px solid var(--line); }
    .tab { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
    .tab.active { color: var(--text); border-color: var(--accent); font-weight: 600; }
    .toolbar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 8px; }
    #editor { width: 100%; min-height: 60vh; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    #mine { width: 100%; min-height: 50vh; }
    .ask { border-top: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 8px; align-items: center; }
    .ask input { flex: 1; }
    .qa { background: var(--panel); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
    .empty { display: grid; place-items: center; height: 100%; text-align: center; padding: 40px; }
    .warn { color: #c2410c; }
  </style>
</head>
<body>
  <aside>
    <div class="top">
      <input id="search" type="text" placeholder="Search meetings">
      <button class="btn primary" id="startNow" title="Start taking notes now">＋</button>
    </div>
    <div id="list"></div>
    <div class="small muted" style="padding:10px 14px"><button class="link" id="folder">Open notes folder</button></div>
  </aside>
  <main>
    <div id="detail"></div>
    <div class="ask" id="askBar" hidden>
      <span>✦</span>
      <input id="question" type="text" placeholder="Ask anything about this meeting — e.g. “draft a follow-up email”">
      <button class="btn" id="askBtn">Ask</button>
    </div>
  </main>
  <script src="ui/common.js"></script>
  <script src="notes.js"></script>
</body>
</html>
